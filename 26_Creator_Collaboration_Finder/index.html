<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syndicate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="global-header">
    <div class="container header-inner">
      <div class="logo-area">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><rect width="8" height="16" rx="2"/><rect x="10" width="6" height="16" rx="2"/></svg>
        <a href="#/">Syndicate</a>
      </div>
      <nav class="nav-links">
        <a href="#/discover">Discover</a>
        <a href="#/shortlist" id="nav-saved">Saved (0)</a>
        <a href="#/projects">Projects</a>
        <a href="#/how-it-works">How it works</a>
      </nav>
      <div class="flex items-center gap-16">
        <button class="btn btn-secondary" data-action="go-profile" id="nav-profile">Create profile</button>
        <button class="btn-icon hamburger" aria-label="Menu" data-action="toggle-menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="mobile-menu" class="hidden" style="position:fixed; top:64px; left:0; right:0; bottom:0; background:var(--bg); z-index:19; padding:24px; border-top:1px solid var(--line);">
    <div class="flex flex-col gap-12">
      <a href="#/discover" class="btn btn-secondary w-full" style="justify-content:flex-start; min-height:48px; border:none; border-bottom:1px solid var(--line); border-radius:0; padding-left:0;" data-action="close-menu">Discover</a>
      <a href="#/shortlist" class="btn btn-secondary w-full" style="justify-content:flex-start; min-height:48px; border:none; border-bottom:1px solid var(--line); border-radius:0; padding-left:0;" data-action="close-menu">Saved</a>
      <a href="#/projects" class="btn btn-secondary w-full" style="justify-content:flex-start; min-height:48px; border:none; border-bottom:1px solid var(--line); border-radius:0; padding-left:0;" data-action="close-menu">Projects</a>
      <a href="#/how-it-works" class="btn btn-secondary w-full" style="justify-content:flex-start; min-height:48px; border:none; border-bottom:1px solid var(--line); border-radius:0; padding-left:0;" data-action="close-menu">How it works</a>
    </div>
  </div>

  <main id="app-root"></main>

  <footer class="global-footer container">
    <div class="footer-grid">
      <div class="footer-col"><h3>Product</h3><a href="#/discover">Discover</a><a href="#/how-it-works">How it works</a><a href="#/profile">Profile</a></div>
      <div class="footer-col"><h3>Resources</h3><a href="#/help">Help & Support</a><a href="#/help">Keyboard shortcuts</a></div>
      <div class="footer-col"><h3>Company</h3><a href="#/">About</a><a href="#/">Blog</a></div>
      <div class="footer-col"><h3>Legal</h3><a href="#/">Privacy</a><a href="#/">Terms</a></div>
    </div>
    <div class="color-text-2">© 2026 Syndicate. A fictional independent software studio product.</div>
  </footer>

  <div class="backdrop" id="backdrop" data-action="close-overlays"></div>
  <div id="overlay-container"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
